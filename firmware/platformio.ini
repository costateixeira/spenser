; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM3
upload_speed = 230400 
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
;board_build.arduino.memory_type = qspi

; This board has 8MB of flash, but the default table only addresses 4MB and
; leaves each application slot at 1.25MB. default_8MB.csv gives two 3.1MB OTA
; slots and a 1.5MB filesystem, which is what makes over-the-air updates of
; both the firmware and the web files possible. Changing this table needs one
; upload over the cable and erases the filesystem, so re-run uploadfs after.
board_build.partitions = default_8MB.csv
build_flags = 
	-DESP32S3
	-DCORE_DEBUG_LEVEL=5
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
; Pinned on purpose. These were floating, and FastLED 3.10 does not compile
; against this core, which broke the build for anyone resolving dependencies
; fresh - every clone and every CI run. FastLED is not used by this code, but
; M5AtomS3 includes it, so it is pinned rather than removed.
lib_deps = 
	ESP32Async/AsyncTCP@^3.5.0
	adafruit/Adafruit NeoPixel@^1.15.5
	fastled/FastLED@~3.9.13
	m5stack/M5AtomS3@^1.0.2
	M5Unified=https://github.com/m5stack/M5Unified
	https://github.com/m5stack/M5Atomic-Motion.git
	ArduinoJson@^7.4.3
	ESP32Async/ESPAsyncWebServer@^3.12.1
upload_flags =
  --before
  default_reset
  --after
  hard_reset